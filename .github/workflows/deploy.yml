name: Verify and deploy AWS backend
on:
  push:
    branches: [deploy/aws]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/deploy/aws'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: algorhythm_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: disposable-ci
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Test with disposable MySQL and Redis
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/algorhythm_test?allowPublicKeyRetrieval=true&sslMode=DISABLED
          SPRING_DATASOURCE_USERNAME: ci
          SPRING_DATASOURCE_PASSWORD: disposable-ci
          REDISHOST: 127.0.0.1
          REDISPORT: '6379'
          REDISPASSWORD: ''
          JWT_SECRET: disposable-ci-jwt-signing-key-at-least-32-bytes
          RESEND_API_KEY: offline-ci
          RESEND_FROM_EMAIL: ci@example.invalid
          BE_A1_AUTH_TEST: '1'
          BE_A2_DB_TEST: '1'
          M3_MYSQL_TEST: '1'
          R1_MYSQL_TEST: '1'
          R2_MYSQL_TEST: '1'
        run: ./gradlew --no-daemon clean test bootJar
      - name: Build tested executable jar into AWS image
        run: |
          bash -n deploy/aws/ec2.sh
          bash -n deploy/aws/release.sh
          python3 -m unittest discover -s deploy/aws -p 'test_*.py'
          mkdir -p "$RUNNER_TEMP/aws-context"
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "$RUNNER_TEMP/aws-context/app.jar"
          docker build --pull --platform linux/amd64 -f deploy/aws/Dockerfile -t "algorhythm-aws:$GITHUB_SHA" "$RUNNER_TEMP/aws-context"
      - name: Smoke test AWS image and schema checks with isolated services
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          for migration in src/main/resources/db/migration/V*.sql; do
            docker exec -i -e MYSQL_PWD=disposable-ci "$MYSQL_CONTAINER" mysql -uci algorhythm_test < "$migration"
          done
          docker run -d --name aws-smoke --network host --read-only --tmpfs /tmp:mode=1777 \
            -e SPRING_PROFILES_ACTIVE=aws -e PORT=18080 \
            -e SPRING_DATASOURCE_URL='jdbc:mysql://127.0.0.1:3306/algorhythm_test?allowPublicKeyRetrieval=true' \
            -e SPRING_DATASOURCE_USERNAME=ci -e SPRING_DATASOURCE_PASSWORD=disposable-ci \
            -e SPRING_APPLICATION_JSON='{"spring":{"datasource":{"hikari":{"data-source-properties":{"sslMode":"DISABLED"}}},"data":{"redis":{"ssl":{"enabled":false}}}}}' \
            -e REDISHOST=127.0.0.1 -e REDISPORT=6379 -e REDISPASSWORD='' \
            -e JWT_SECRET=disposable-ci-jwt-signing-key-at-least-32-bytes \
            -e RESEND_API_KEY=offline-ci -e RESEND_FROM_EMAIL=ci@example.invalid \
            "algorhythm-aws:$GITHUB_SHA"
          for attempt in {1..60}; do
            if curl -fsS --max-time 5 http://127.0.0.1:18080/actuator/health 2>/dev/null | jq -e '. == {"status":"UP"}'; then exit 0; fi
            sleep 2
          done
          docker logs aws-smoke
          exit 1
      - name: Export release image
        if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'deploy:release-aws'
        run: docker save --output "$RUNNER_TEMP/image.tar" "algorhythm-aws:$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'deploy:release-aws'
        with:
          name: aws-image
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/deploy/aws' && (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'deploy:release-aws')
    runs-on: ubuntu-24.04
    environment: aws-production
    concurrency:
      group: algorhythm-aws-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 55
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      RUNTIME_SECRET_ARN: ${{ vars.RUNTIME_SECRET_ARN }}
      TARGET_GROUP_ARN: ${{ vars.TARGET_GROUP_ARN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aws-image
          path: ${{ runner.temp }}/aws-image
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: algorhythm-${{ github.run_id }}
      - name: Publish image, replace container and verify through ALB
        run: bash deploy/aws/release.sh
