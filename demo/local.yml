app:
  passkeys:
    environment: local
server:
  address: 127.0.0.1
spring:
  jpa:
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations:
        - classpath:db/migration/V20261122_01__school_load_and_schedule_versions.sql
        - classpath:db/migration/V20261124_01__generation_and_lesson_operations.sql
        - classpath:db/migration/V20261125_11__school_teacher_roster.sql
        - classpath:db/migration/V20261125_21__passkey_auth.sql
        - classpath:db/migration/V20261125_22__roster_import_preview.sql
        - classpath:db/migration/V20261126_31__school_roster_names.sql
        - classpath:db/migration/V20261127_41__roster_teaching_link.sql
        - classpath:db/migration/V20261127_42__lesson_change_notification_target.sql
        - classpath:db/migration/V20261127_43__term_class_teacher_role.sql
        - classpath:db/migration/V20261127_44__public_cover_recipients.sql
      data-locations: file:./demo/seed.sql
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

school42:
  team-reset-enabled: true
