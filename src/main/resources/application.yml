server:
  port: ${PORT:8080}

spring:

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDISHOST:localhost} #EC2할때는 언더바
      port: ${REDISPORT:6379} #EC2할때는 언더바
      password: ${REDISPASSWORD}
      timeout: 60000 # 연결 타임아웃 60초
      lettuce:
        pool:
          max-active: 8 # 최대 활성 연결 수
          max-idle: 8 # 최대 유휴 연결 수
          min-idle: 0 # 최소 유휴 연결 수

email:
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM_EMAIL:}
    connect-timeout: 10s
    read-timeout: 30s
  verification:
    expiration: '5'
    allowed-domains:
      - ewha.ac.kr
      - gmail.com  # 테스트용

# application.yml 예시
springdoc:
 swagger-ui:
   enabled: false
 api-docs:
   enabled: false


oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:default_client_id}
    client-secret: ${KAKAO_CLIENT_SECRET:default_client_secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.example.unis_rssol: INFO
    org.hibernate.SQL: INFO                # SQL 쿼리만 출력
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.transaction: INFO
    org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport: WARN

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini

management:
  endpoints:
    web:
      exposure:
        include: health,info  # 허용할 엔드포인트
  endpoint:
    health:
      show-details: always  # 상세 정보 표시, 필요에 따라 'never' 또는 'when-authorized'
