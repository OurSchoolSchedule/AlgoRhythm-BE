server:
  port: 8080

spring:

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000 # 연결 타임아웃 60초
      lettuce:
        pool:
          max-active: 8 # 최대 활성 연결 수
          max-idle: 8 # 최대 유휴 연결 수
          min-idle: 0 # 최소 유휴 연결 수

  mail:
    properties:
      mail:
        smtp:
          starttls:
            enable: 'true'
            required: 'true'
          timeout: '5000'
          auth: 'true'
          connectiontimeout: '5000'
          writetimeout: '5000'
    host: smtp.gmail.com
    username: ${MAIL_USERNAME:admin@example.com}
    password: ${MAIL_PASSWORD:default_password}
    port: '587'
email:
  verification:
    expiration: '5'
    allowed-domains:
      - ewha.ac.kr
      - gmail.com  # 테스트용

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.example.unis_rssol: INFO
    org.hibernate.SQL: INFO                # SQL 쿼리만 출력
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.transaction: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info  # 허용할 엔드포인트
  endpoint:
    health:
      show-details: always  # 상세 정보 표시, 필요에 따라 'never' 또는 'when-authorized'
